default_policy: deny

services:
  qs-apiserver.svc:
    allow_all: false
    subject_types:
      - user
    roles:
      - qs:admin
      - qs:content_manager
      - qs:assessment_operator
      - qs:result_reviewer
      - qs:evaluation_plan_manager
    require_delegated_actor_on_grant: true

  admin:
    allow_all: true
