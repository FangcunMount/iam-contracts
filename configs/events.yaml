version: "1"

topics:
  authz_version:
    name: iam.authz.version.v2
    description: Authorization policy version changes.
  notification_sms:
    name: iam.notify.sms
    description: SMS notification tasks.

events:
  iam.authz.version_changed.v2:
    topic: authz_version
    delivery: durable_outbox
    aggregate: PolicyVersion
    domain: authz
    handler: iam-policy-sync
    description: Authorization policy version changed.
  iam.login_otp_sms:
    topic: notification_sms
    delivery: best_effort
    aggregate: LoginOTP
    domain: authn
    handler: sms-dispatcher
    description: Login OTP SMS dispatch request.
